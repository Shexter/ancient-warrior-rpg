name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      # raylib (heroes-window) builds against X11 and OpenGL on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      # Runners have no display: the window-display tests run locally only.
      - run: ctest --preset ci -LE window-display

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/asan/_deps
          key: deps-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
      # raylib (heroes-window) builds against X11 and OpenGL on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan -LE window-display
